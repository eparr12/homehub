# The CI gates in docs/coding-standards.md. The main ruleset requires the
# check, e2e and image jobs by name, so no job has a name: key, and
# pull_request has no filter: a required job that never starts leaves a pull
# request waiting.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A read-only token for every job that doesn't ask for more, and no secret but
# that token (SEC-1).
permissions:
  contents: read

jobs:
  check:
    # Not ubuntu-latest: that label moves on GitHub's schedule, which would
    # change the system we test on a day nobody chose.
    runs-on: ubuntu-26.04
    # A backstop for a hung job, not a budget.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # package.json has no packageManager field, so setup-node caches npm's
      # downloads only when asked.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # CI is set here, so Vitest prints the coverage table (vitest.config.ts).
      - run: npm run check
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-26.04
    # A backstop for a hung job, not a budget. It has to outlast a run of
    # failing tests, so that the job ends as failed and uploads its report. A
    # test that hits its 30 s timeout adds about 15 s on two workers, so the
    # limit covers a run in which every test does only while the suite has
    # fewer than about 50 tests. Raise it before the suite reaches 50, or cap
    # failures in Playwright once build-plan step 2.7 has chosen how.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No browser cache: Playwright's CI guide finds that restoring one takes
      # about as long as the download.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      # Anyone signed in to GitHub can download this report, so test data
      # stays made up (GIT-7).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Builds the image, starts it as the host runs it, and on main pushes it to
  # GHCR. Only the runner's own docker commands, and no docker/* actions, so no
  # third-party code runs with a token that can write packages.
  image:
    runs-on: ubuntu-26.04
    # A backstop for a hung job, not a budget.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        # Named, because only then does GitHub add pipefail, which the smoke
        # test's pipes need.
        shell: bash
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --check .
      - run: docker build --build-arg "GIT_SHA=$GITHUB_SHA" --tag "$IMAGE:main" .
      # Starts the image as the host runs it, through compose.yaml itself,
      # which finds this build under the tag it asks for; --pull never makes
      # sure that nothing else gets tested. A build alone proves too little:
      # one with a runtime package in devDependencies passes check and e2e,
      # then exits as it starts. The server must first refuse a backups folder
      # that it can't write to, such as one that Docker makes for root, and
      # then start with a writable one.
      - name: Smoke test
        id: smoke
        run: |
          echo 'ALLOWED_USERS=ci@example.com=ci' > .env
          # The server has to refuse a backups folder that it can't write to.
          install -d -m 0555 data/backups
          if docker compose up --detach --wait --wait-timeout 30 --pull never; then
            echo 'The server started with a backups folder it cannot write to.'
            exit 1
          fi
          # --count, not --quiet: under pipefail, grep --quiet can close the
          # pipe while docker compose logs is still writing, and fail the step.
          docker compose logs | grep --count "EACCES: permission denied, access '/data/backups'"
          docker compose down
          chmod 0777 data/backups
          docker compose up --detach --wait --wait-timeout 60 --pull never
          test "$(docker compose exec -T homehub id -un)" = node
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health |
            jq --exit-status --arg sha "$GITHUB_SHA" '.status == "ok" and .version == $sha'
          curl --fail --silent --show-error --header 'Tailscale-User-Login: ci@example.com' \
            http://127.0.0.1:8080/api/me | jq --exit-status '.shortName == "ci"'
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep --quiet '<div id="root">'
          docker compose stop
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet)")" = 0
      # Only the smoke test leaves a container to read.
      - if: failure() && steps.smoke.outcome == 'failure'
        run: docker compose logs
      # Every commit on main gets its sha- tag. Runs for two quick merges can
      # finish in either order, so the main tag moves only while main still
      # names this commit, and never back to an older one.
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:main" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          main_now="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$main_now" = "$GITHUB_SHA" ]; then
            docker push "$IMAGE:main"
          else
            echo "main has moved on to $main_now, so its run moves the main tag"
          fi
